<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>核能化學研究所 | Control Terminal</title>
    <!-- 使用 CDN 加載，並提供 fallback -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* 基礎樣式備份，防止 Tailwind 沒讀取到時畫面崩潰 */
        body {
            margin: 0;
            background-color: #020617;
            color: #f8fafc;
            font-family: sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        #main-terminal {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* 核心掃描線效果 */
        .scanline {
            width: 100%;
            height: 2px;
            background: rgba(34, 197, 94, 0.1);
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            animation: scan 4s linear infinite;
            z-index: 100;
        }

        @keyframes scan {
            0% { top: -10%; }
            100% { top: 110%; }
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 視窗與彈窗 */
        .modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 400px;
            background: white;
            color: #0f172a;
            border-radius: 1.5rem;
            padding: 2rem;
            display: none;
            z-index: 1000;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .input-underline {
            border: none;
            border-bottom: 3px solid #cbd5e1;
            width: 100%;
            text-align: center;
            font-size: 2.5rem;
            font-weight: bold;
            outline: none;
            margin: 1rem 0;
        }

        /* 跳躍按鈕 */
        #jump-trigger {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #3b82f6;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 50;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.6);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #timer-bar {
            height: 100%;
            background: #ef4444;
            width: 100%;
            transition: width 0.1s linear;
        }

        .hazard-blink {
            animation: blink 0.5s infinite alternate;
        }

        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="scanline"></div>

    <div id="main-terminal">
        <!-- 頂部資訊列 -->
        <header class="h-20 bg-slate-900 flex items-center justify-between px-6 border-b border-slate-700">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-yellow-500 rounded flex items-center justify-center text-slate-900 font-bold">
                    ☢
                </div>
                <div>
                    <h1 class="text-xs font-black uppercase tracking-widest text-white">Lab Terminal v2</h1>
                    <p id="sys-status" class="text-[10px] text-green-500 font-mono">STATUS: OK</p>
                </div>
            </div>

            <div class="flex gap-6">
                <div class="text-right">
                    <p class="text-[10px] text-slate-500 font-bold">STABILITY</p>
                    <p id="score-val" class="text-xl font-mono text-green-400">000000</p>
                </div>
                <div class="text-right min-w-[100px]">
                    <p class="text-[10px] text-slate-500 font-bold">FORBIDDEN</p>
                    <p id="forbidden-name" class="text-xs text-red-500 font-bold uppercase tracking-tighter">--</p>
                    <div class="w-full bg-slate-800 h-1 mt-1">
                        <div id="timer-bar"></div>
                    </div>
                </div>
            </div>
        </header>

        <!-- 遊戲畫布 -->
        <div class="relative flex-grow bg-black overflow-hidden" id="canvas-wrapper">
            <canvas id="gameCanvas"></canvas>
            
            <!-- 彈窗: 原子序 -->
            <div id="modal-atom" class="modal">
                <p class="text-center text-slate-400 text-xs font-bold uppercase">System Lockdown</p>
                <h2 id="target-symbol" class="text-8xl font-black text-center text-blue-600 my-4">--</h2>
                <input type="number" id="input-atom" class="input-underline" placeholder="?" autocomplete="off">
                <p class="text-center text-[10px] text-slate-400">輸入原子序並按下 [ENTER] 重啟</p>
            </div>

            <!-- 彈窗: 數學 -->
            <div id="modal-math" class="modal">
                <p class="text-center text-amber-500 text-xs font-bold uppercase italic">Error Corrupted</p>
                <div id="math-display" class="bg-slate-100 p-4 rounded-lg font-mono text-xl text-center my-4 border-l-4 border-amber-500"></div>
                <input type="number" id="input-math" class="input-underline" placeholder="X = ?" autocomplete="off">
                <p class="text-center text-[10px] text-slate-400">解出 X 並按下 [ENTER] 修正</p>
            </div>
        </div>

        <!-- 跳躍按鈕 -->
        <div id="jump-trigger">
            <span class="text-2xl">▲</span>
            <span class="text-[9px] font-bold">JUMP</span>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score-val');
        const forbiddenEl = document.getElementById('forbidden-name');
        const timerBar = document.getElementById('timer-bar');
        const statusEl = document.getElementById('sys-status');

        const GROUPS = [
            { id: 1, name: "IA 鹼金屬", el: [{s:"H",n:1},{s:"Li",n:3},{s:"Na",n:11},{s:"K",n:19},{s:"Rb",n:37},{s:"Cs",n:55}] },
            { id: 2, name: "IIA 鹼土", el: [{s:"Be",n:4},{s:"Mg",n:12},{s:"Ca",n:20},{s:"Sr",n:38},{s:"Ba",n:56}] },
            { id: 17, name: "VIIA 鹵素", el: [{s:"F",n:9},{s:"Cl",n:17},{s:"Br",n:35},{s:"I",n:53},{s:"At",n:85}] },
            { id: 18, name: "VIIIA 鈍氣", el: [{s:"He",n:2},{s:"Ne",n:10},{s:"Ar",n:18},{s:"Kr",n:36},{s:"Xe",n:54},{s:"Rn",n:86}] }
        ];

        const ALL = GROUPS.flatMap(g => g.el.map(e => ({...e, gId: g.id})));

        let score = 0, speed = 7, isDead = false, isPunishing = false;
        let obstacles = [], punisher = null, currentTarget = null;
        let forbiddenId = null, switchTime = 0;
        const INTERVAL = 6000;

        const player = {
            x: 50, y: 0, w: 40, h: 40, dy: 0, gravity: 0.8, jump: 15, grounded: true,
            update() {
                this.dy += this.gravity;
                this.y += this.dy;
                const ground = canvas.height - this.h - 20;
                if (this.y > ground) {
                    this.y = ground;
                    this.dy = 0;
                    this.grounded = true;
                }
            },
            draw() {
                ctx.fillStyle = isPunishing ? '#ef4444' : '#3b82f6';
                ctx.beginPath();
                ctx.roundRect(this.x, this.y, this.w, this.h, 8);
                ctx.fill();
                // 眼睛
                ctx.fillStyle = 'white';
                ctx.fillRect(this.x + 25, this.y + 10, 8, 8);
            }
        };

        class Atom {
            constructor() {
                const el = ALL[Math.floor(Math.random() * ALL.length)];
                Object.assign(this, el);
                this.w = 60; this.h = 60;
                this.x = canvas.width;
                this.y = canvas.height - this.h - 20;
                this.isBad = (this.gId === forbiddenId);
                this.triggered = false;
            }
            draw() {
                ctx.fillStyle = this.isBad ? '#450a0a' : '#1e293b';
                ctx.strokeStyle = this.isBad ? '#ef4444' : '#475569';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(this.x, this.y, this.w, this.h, 12);
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = 'white';
                ctx.font = 'bold 20px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(this.s, this.x + this.w/2, this.y + this.h/2 + 8);
            }
            update() { this.x -= speed; this.draw(); }
        }

        class Uranium {
            constructor() {
                this.w = 80; this.h = 80; this.x = canvas.width + 100;
                this.y = canvas.height - this.h - 20; this.speed = 30;
            }
            draw() {
                ctx.fillStyle = '#065f46';
                ctx.strokeStyle = '#34d399';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.roundRect(this.x, this.y, this.w, this.h, 15);
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = '#34d399';
                ctx.font = '900 30px serif';
                ctx.textAlign = 'center';
                ctx.fillText("U", this.x + this.w/2, this.y + this.h/2 + 10);
            }
            update() { this.x -= this.speed; this.draw(); }
        }

        function changeForbidden() {
            const next = GROUPS[Math.floor(Math.random() * GROUPS.length)];
            forbiddenId = next.id;
            forbiddenEl.innerText = next.name;
        }

        function jump() {
            if (player.grounded && !isDead && !isPunishing) {
                player.dy = -player.jump;
                player.grounded = false;
            }
        }

        // 事件監聽
        window.addEventListener('keydown', e => {
            if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); }
            if (e.key === 'Enter') {
                if (document.getElementById('modal-atom').style.display === 'block') checkAtom();
                else if (document.getElementById('modal-math').style.display === 'block') checkMath();
            }
        });
        jumpBtn = document.getElementById('jump-trigger');
        jumpBtn.addEventListener('touchstart', e => { e.preventDefault(); jump(); });
        jumpBtn.addEventListener('mousedown', e => { e.preventDefault(); jump(); });

        function loop(ts) {
            if (isDead) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 地面線
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, canvas.height - 20); ctx.lineTo(canvas.width, canvas.height - 20); ctx.stroke();

            if (!isPunishing) {
                if (!switchTime) switchTime = ts;
                const elapsed = ts - switchTime;
                timerBar.style.width = Math.max(0, 100 - (elapsed/INTERVAL*100)) + '%';
                if (elapsed >= INTERVAL) { changeForbidden(); switchTime = ts; }

                if (Math.random() < 0.02 && (obstacles.length === 0 || canvas.width - obstacles[obstacles.length-1].x > 280)) {
                    obstacles.push(new Atom());
                }
            }

            player.update(); player.draw();

            obstacles.forEach((ob, i) => {
                ob.update();
                const hit = player.x < ob.x + ob.w && player.x + player.w > ob.x && player.y < ob.y + ob.h && player.y + player.h > ob.y;
                
                let fail = false;
                if (!ob.isBad && !player.grounded && player.x + player.w > ob.x && player.x < ob.x + ob.w && player.y + player.h <= ob.y + 10 && !ob.triggered) {
                    fail = true; ob.triggered = true;
                }
                if (ob.isBad && hit && player.grounded) fail = true;

                if (fail && !isPunishing) {
                    isPunishing = true; currentTarget = ob; punisher = new Uranium();
                    statusEl.innerText = "STATUS: DANGER"; statusEl.className = "text-red-500 hazard-blink";
                }

                if (hit && !ob.isBad && !isPunishing) {
                    score += 100; scoreEl.innerText = score.toString().padStart(6, '0');
                    obstacles.splice(i, 1);
                } else if (ob.x + ob.w < 0) {
                    if (ob.isBad) { score += 200; scoreEl.innerText = score.toString().padStart(6, '0'); }
                    obstacles.splice(i, 1);
                }
            });

            if (isPunishing && punisher) {
                punisher.update();
                if (punisher.x < player.x + player.w) {
                    isDead = true;
                    document.getElementById('target-symbol').innerText = currentTarget.s;
                    document.getElementById('modal-atom').style.display = 'block';
                    document.getElementById('input-atom').value = '';
                    document.getElementById('input-atom').focus();
                }
            }
            requestAnimationFrame(loop);
        }

        function checkAtom() {
            const val = parseInt(document.getElementById('input-atom').value);
            if (val === currentTarget.n) revive();
            else {
                document.getElementById('modal-atom').style.display = 'none';
                const x1 = currentTarget.n;
                const x2 = Math.floor(Math.random() * 5) + 2;
                const b = -(x1 + x2); const c = x1 * x2;
                document.getElementById('math-display').innerText = `x² ${b < 0 ? '-' : '+'} ${Math.abs(b)}x ${c < 0 ? '-' : '+'} ${Math.abs(c)} = 0`;
                const mModal = document.getElementById('modal-math');
                mModal.style.display = 'block';
                const mInput = document.getElementById('input-math');
                mInput.value = ''; mInput.dataset.ans = x1;
                mInput.focus();
            }
        }

        function checkMath() {
            const input = document.getElementById('input-math');
            if (parseInt(input.value) === parseInt(input.dataset.ans)) revive();
            else initGame();
        }

        function revive() {
            isDead = false; isPunishing = false; obstacles = []; punisher = null;
            document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
            statusEl.innerText = "STATUS: OK"; statusEl.className = "text-green-500";
            switchTime = performance.now();
            requestAnimationFrame(loop);
        }

        function initGame() {
            canvas.width = canvas.parentElement.offsetWidth;
            canvas.height = canvas.parentElement.offsetHeight;
            score = 0; scoreEl.innerText = '000000';
            changeForbidden();
            revive();
        }

        window.onload = initGame;
        window.onresize = () => {
            canvas.width = canvas.parentElement.offsetWidth;
            canvas.height = canvas.parentElement.offsetHeight;
        };
    </script>
</body>
</html>
