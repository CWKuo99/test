<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>5-5 熱的傳播方式</title>
<style>
:root{--ink:#1d2329;--muted:#5f6b76;--line:#d5dce2;--soft:#f3f6f8;--accent:#d9480f;--sel:#1864ab;--sel-soft:#e7f1fb;--water:#1c7ed6;--alc:#e8590c;--cold:#d0ebff;--hot:#ffe3d1;--ok:#2b8a3e}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--ink);font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:18px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px)) 40px max(16px,env(safe-area-inset-right,0px))}
header{padding:14px 0 8px;border-bottom:1px solid var(--line);margin-bottom:12px}
.top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
h1{font-size:26px;margin:0}
h2{font-size:21px;margin:22px 0 8px}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.nav a{font-size:16px;text-decoration:none;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:8px 12px;min-height:44px;display:inline-flex;align-items:center}
.nav a[aria-current]{background:var(--sel);color:#fff;border-color:var(--sel)}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:8px 0}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.grp>.lab{font-size:16px;color:var(--muted);margin-right:2px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);background:#fff;font:inherit;font-size:17px;min-height:44px;min-width:44px;padding:6px 12px;cursor:pointer;color:var(--ink)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--sel);color:#fff}
.btn{font:inherit;font-size:17px;min-height:44px;padding:6px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.45}
.switch{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:17px;cursor:pointer;user-select:none}
.switch input{width:22px;height:22px;accent-color:var(--sel)}
input[type=range]{width:180px;height:44px;accent-color:var(--sel)}
.stage{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.stage{grid-template-columns:minmax(0,1fr)}}
canvas{display:block;width:100%;height:auto;max-width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;touch-action:manipulation}
.reads{display:flex;flex-wrap:wrap;gap:8px 22px;margin:8px 0;font-size:18px}
.reads b{font-variant-numeric:tabular-nums;font-size:22px}
.note{font-size:16px;color:var(--muted);margin:6px 0}
.panel{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:10px 0;background:var(--soft)}
.ans{font-weight:700;color:var(--accent)}
.tbl{border-collapse:collapse;margin:12px 0;font-size:17px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 10px;text-align:center;white-space:nowrap}
@media (max-width:480px){.tbl th,.tbl td{padding:6px 6px}}
.tbl th{background:var(--soft);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="top">
    <h1>5-5 熱的傳播方式</h1>
    <div class="grp">
      <label class="switch"><input type="checkbox" id="adv">進階</label>
    </div>
  </div>
  <nav class="nav" aria-label="第五章各站">
    <a href="heat_thermometer.html">1 溫度計</a>
    <a href="heat_rise.html">2 水溫上升</a>
    <a href="heat_equilibrium.html">3 熱平衡</a>
    <a href="heat_specific.html">4 比熱</a>
    <a href="heat_matter.html">5 體積與三態</a>
    <a href="heat_transfer.html" aria-current="page">6 熱的傳播</a>
  </nav>
</header>
<div class="bar">
  <div class="grp"><span class="lab">方式</span>
    <div class="seg" id="mode"><button data-v="cond" aria-pressed="true">傳導</button><button data-v="conv">對流</button><button data-v="rad">輻射</button></div>
  </div>
</div>
<div class="bar">
  <button class="btn primary" id="go">開始加熱</button>
  <button class="btn" id="reset">重新開始</button>
  <div class="grp"><span class="lab">時間快轉</span><div class="seg" id="speed"><button data-v="1">×1</button><button data-v="5" aria-pressed="true">×5</button><button data-v="20">×20</button></div></div>
  <div class="grp" id="radCtl" hidden><span class="lab">中央放</span><div class="seg" id="src"><button data-v="lamp" aria-pressed="true">酒精燈</button><button data-v="ice">大量冰塊</button></div></div>
</div>
<div class="stage">
  <div>
    <canvas id="scene" width="440" height="420" style="max-width:440px" aria-label="熱的傳播"></canvas>
    <div class="reads"><span>時間 <b id="rt">0</b> 秒</span></div>
  </div>
  <div>
    <div id="condOut"><table class="tbl" id="ctbl"></table>
      <p class="note">四根棒子粗細、長度相同，左端用同一個火焰加熱。每隔 4 cm 用蠟（約 55℃ 熔化）黏一根火柴。</p></div>
    <canvas id="graph" width="640" height="340" aria-label="溫度與時間" hidden></canvas>
    <p class="note" id="gnote"></p>
  </div>
</div>


</div>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const PFX = 'heattx-';
const store = {
  get(k, d) { try { const v = localStorage.getItem(PFX + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(PFX + k, JSON.stringify(v)); } catch (e) {} }
};
const FONT = 'system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif';
// 畫布：fixed=true 時固定邏輯尺寸、整張縮放；否則依實際寬度重設（文字維持原大小）
function setup(cv, fixed, hOf) {
  const o = { cv, c: cv.getContext('2d'), W: cv.width, H: cv.height, fixed, hOf };
  fit(o); return o;
}
function fit(o) {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  if (!o.fixed) { const w = Math.round(o.cv.getBoundingClientRect().width) || o.W; o.W = w; o.H = o.hOf(w); }
  o.cv.width = o.W * dpr; o.cv.height = o.H * dpr;
  if (!o.fixed) o.cv.style.height = o.H + 'px';
  o.c.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function seg(id, cb) {
  const el = $(id);
  el.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || !el.contains(b)) return;
    el.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
    const v = b.dataset.v; cb(isNaN(+v) ? v : +v);
  });
}
function setSeg(id, v) { $(id).querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.v) === String(v))); }
function axes(c, W, H, x0, x1, y0, y1, xl, yl, P) {
  c.strokeStyle = '#adb5bd'; c.lineWidth = 1; c.fillStyle = '#5f6b76'; c.font = `16px ${FONT}`;
  const X = x => P.l + (x - x0) / (x1 - x0) * (W - P.l - P.r), Y = y => H - P.b - (y - y0) / (y1 - y0) * (H - P.t - P.b);
  const nice = r => { const e = Math.pow(10, Math.floor(Math.log10(r / 5))), m = r / 5 / e; return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * e; };
  const dx = nice(x1 - x0), dy = nice(y1 - y0);
  c.textAlign = 'center'; c.textBaseline = 'top';
  for (let x = Math.ceil(x0 / dx) * dx; x <= x1 + 1e-9; x += dx) { c.globalAlpha = .4; c.beginPath(); c.moveTo(X(x), P.t); c.lineTo(X(x), H - P.b); c.stroke(); c.globalAlpha = 1; c.fillText(+x.toFixed(6) + '', X(x), H - P.b + 5); }
  c.textAlign = 'right'; c.textBaseline = 'middle';
  for (let y = Math.ceil(y0 / dy) * dy; y <= y1 + 1e-9; y += dy) { c.globalAlpha = .4; c.beginPath(); c.moveTo(P.l, Y(y)); c.lineTo(W - P.r, Y(y)); c.stroke(); c.globalAlpha = 1; c.fillText(+y.toFixed(6) + '', P.l - 6, Y(y)); }
  c.strokeStyle = '#495057'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(P.l, P.t); c.lineTo(P.l, H - P.b); c.lineTo(W - P.r, H - P.b); c.stroke();
  c.font = `16px ${FONT}`; c.fillStyle = '#343a40';
  c.textAlign = 'right'; c.textBaseline = 'bottom'; c.fillText(xl, W - P.r, H - P.b - 4);
  c.textAlign = 'left'; c.textBaseline = 'top'; c.fillText(yl, P.l + 6, 4);
  return { X, Y };
}

const ROOM = 25;
const S = { mode: 'cond', run: false, t: 0, speed: 5, src: 'lamp', adv: store.get('adv', false) };
const sc = setup($('#scene'), true);
const gH = w => w < 520 ? 280 : 340;
const gr = setup($('#graph'), false, gH);
window.addEventListener('resize', () => { if (!$('#graph').hidden) fit(gr); });
function tcol(T) { // 溫度色：25℃ 灰 → 250℃ 紅黃
  const k = Math.max(0, Math.min(1, (T - 25) / 200));
  return `rgb(${Math.round(173 + 82 * k)},${Math.round(181 - 60 * k + 80 * Math.max(0, k - .7))},${Math.round(189 - 170 * k)})`;
}
function wcol(T) { const k = Math.max(0, Math.min(1, (T - 20) / 80)); return `rgba(${Math.round(165 + 90 * k)},${Math.round(216 - 60 * k)},${Math.round(255 - 175 * k)},.85)`; }
function flame(c, x, y, s) { const f = s * (0.92 + Math.random() * .12); c.fillStyle = 'rgba(255,146,43,.9)'; c.beginPath(); c.moveTo(x - 8 * s / 30, y); c.quadraticCurveTo(x - 12 * s / 30, y - f * .5, x, y - f); c.quadraticCurveTo(x + 12 * s / 30, y - f * .5, x + 8 * s / 30, y); c.fill(); c.fillStyle = 'rgba(77,171,247,.8)'; c.beginPath(); c.moveTo(x - 4, y); c.quadraticCurveTo(x - 4, y - f * .3, x, y - f * .45); c.quadraticCurveTo(x + 4, y - f * .3, x + 4, y); c.fill(); }

/* ================= 傳導：金屬棒 ================= */
// 熱擴散率 α（cm²/s）與側面散熱率 β（1/s，半徑 0.25 cm、h≈15 W/m²K）
// rc：每 cm³ 的熱容量（J/℃）
const RODS = [
  { n: '銀', a: 1.66, b: 0.0049, rc: 2.47, col: '#adb5bd' },
  { n: '銅', a: 1.11, b: 0.0035, rc: 3.45, col: '#d9480f' },
  { n: '鐵', a: 0.23, b: 0.0034, rc: 3.54, col: '#495057' },
  { n: '玻璃', a: 0.0043, b: 0.0057, rc: 2.10, col: '#74c0fc' }
];
// 火焰加熱左端：功率 G×(T_F − T端)，約 13 W 起跳；棒子截面積 0.196 cm²
const L = 16, DX = 0.5, NC = Math.round(L / DX) + 1, T_F = 700, G = 0.02, AREA_CM2 = 0.196, WAX = 55, PINS = [4, 8, 12];
let rods;
function resetCond() { rods = RODS.map(r => ({ ...r, T: new Array(NC).fill(ROOM), drop: PINS.map(() => null) })); }
function stepCond(dt) {
  const amax = Math.max(...RODS.map(r => r.a)), h = 0.4 * DX * DX / (2 * amax);
  let left = dt;
  while (left > 1e-9) {
    const d = Math.min(h, left);
    rods.forEach(r => {
      const T = r.T, N = T.slice();
      const cell = r.rc * AREA_CM2 * DX;                    // 一格的熱容量 J/℃
      for (let i = 0; i < NC; i++) {
        const left = i === 0 ? T[1] : T[i - 1], right = i === NC - 1 ? T[i - 1] : T[i + 1];   // 兩端絕熱
        N[i] = T[i] + d * (r.a * (left - 2 * T[i] + right) / (DX * DX) - r.b * (T[i] - ROOM));
      }
      N[0] += d * G * (T_F - T[0]) / (cell / 2);
      r.T = N;
    });
    S.t += d; left -= d;
    rods.forEach(r => PINS.forEach((p, j) => { if (r.drop[j] === null && r.T[Math.round(p / DX)] >= WAX) r.drop[j] = S.t; }));
  }
}
function drawCond() {
  const { c, W, H } = sc; c.clearRect(0, 0, W, H);
  const x0 = 60, x1 = 420, ppc = (x1 - x0) / L;
  if (S.run) { c.fillStyle = 'rgba(255,146,43,.35)'; c.fillRect(x0 - 6, 40, 14, 320); }
  c.fillStyle = '#5f6b76'; c.font = `16px ${FONT}`; c.textAlign = 'left'; c.textBaseline = 'top'; c.fillText('← 左端一起加熱', x0 - 6, 392);
  rods.forEach((r, k) => {
    const y = 60 + k * 85;
    for (let i = 0; i < NC - 1; i++) { c.fillStyle = tcol((r.T[i] + r.T[i + 1]) / 2); c.fillRect(x0 + i * DX * ppc, y - 7, DX * ppc + .5, 14); }
    c.strokeStyle = r.col; c.lineWidth = 2; c.strokeRect(x0, y - 7, x1 - x0, 14);
    c.fillStyle = '#212529'; c.font = `bold 18px ${FONT}`; c.textAlign = 'right'; c.textBaseline = 'middle'; c.fillText(r.n, x0 - 8, y);
    PINS.forEach((p, j) => {
      const x = x0 + p * ppc;
      if (r.drop[j] === null) { c.fillStyle = '#fff3bf'; c.beginPath(); c.arc(x, y + 10, 5, 0, 7); c.fill(); c.fillStyle = '#e67700'; c.fillRect(x - 2, y + 12, 4, 34); c.fillStyle = '#c92a2a'; c.beginPath(); c.arc(x, y + 48, 4, 0, 7); c.fill(); }
      else { const fall = Math.min(1, (S.t - r.drop[j]) / (2 * S.speed)); if (fall < 1) { c.save(); c.globalAlpha = 1 - fall; c.translate(x, y + 30 + fall * 40); c.rotate(fall * 1.2); c.fillStyle = '#e67700'; c.fillRect(-2, -17, 4, 34); c.restore(); } else { c.fillStyle = '#c92a2a'; c.font = `bold 15px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'top'; c.fillText('掉了', x, y + 14); } }
    });
  });
  // 刻度
  c.fillStyle = '#5f6b76'; c.font = `16px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'top';
  [0, 4, 8, 12, 16].forEach(p => c.fillText(p + ' cm', x0 + p * ppc, 22));
  // 溫度色標
  c.textAlign = 'left';
}
function condTable() {
  const f = v => v === null ? '—' : `${Math.round(v)} 秒`;
  $('#ctbl').innerHTML = `<thead><tr><th>棒子</th>${PINS.map(p => `<th>${p} cm 火柴掉落</th>`).join('')}</tr></thead><tbody>${rods.map(r => `<tr><th>${r.n}</th>${r.drop.map(v => `<td>${f(v)}</td>`).join('')}</tr>`).join('')}</tbody>`;
}

/* ================= 對流：試管加熱位置 ================= */
const NZ = 42, DZ = 0.25, CELL_G = 0.5, Q_FLAME = 20;      // 10.5 cm 水柱、每格 0.5 g、火焰給水 20 卡/秒
const HEAT_AT = { bottom: [0, 1, 2], top: [28, 29, 30] };
let tubes;
function resetConv() {
  tubes = ['bottom', 'top'].map(k => ({ k, T: new Array(NZ).fill(ROOM), hist: [[0, ROOM, ROOM]], bits: Array.from({ length: 14 }, () => ({ x: Math.random() * 0.9 + 0.05, z: NZ * DZ - 0.15 - Math.random() * 0.2 })), boil: false }));
}
function stepConv(dt) {
  const n = Math.ceil(dt / 0.02), h = dt / n;
  for (let s = 0; s < n; s++) {
    tubes.forEach(tb => {
      const T = tb.T, H = HEAT_AT[tb.k];
      H.forEach(i => { T[i] += Q_FLAME / H.length * h / CELL_G; });
      // 傳導（水與玻璃壁，等效擴散 0.01 cm²/s）與散熱
      const N = T.slice();
      for (let i = 0; i < NZ; i++) { const up = i < NZ - 1 ? T[i + 1] : T[i], dn = i > 0 ? T[i - 1] : T[i]; N[i] += h * (0.01 * (up - 2 * T[i] + dn) / (DZ * DZ) - 0.002 * (T[i] - ROOM)); }
      // 對流：加熱處以上的水受熱上升、冷水下沉，整段快速混合（時間常數約 0.4 秒）；加熱處以下只有傳導
      const z0 = H[0]; let m = 0; for (let i = z0; i < NZ; i++) m += N[i]; m /= NZ - z0;
      const r = Math.min(1, h / 0.4);
      for (let i = z0; i < NZ; i++) N[i] += (m - N[i]) * r;
      tb.boil = false;
      for (let i = 0; i < NZ; i++) if (N[i] > 100) { N[i] = 100; tb.boil = true; }
      tb.T = N;
    });
    S.t += h;
  }
  tubes.forEach(tb => { const lt = tb.hist[tb.hist.length - 1][0]; if (S.t - lt >= 0.5) tb.hist.push([S.t, tb.T[1], tb.T[NZ - 2]]); });
}
function moveBits(dt) {
  tubes.forEach(tb => {
    const z0 = HEAT_AT[tb.k][0] * DZ, z1 = NZ * DZ;
    tb.bits.forEach(b => {
      if (S.run && b.z >= z0 - 0.3) {
        // 管中央上升、管壁下沉的循環（流速約 1 cm/s）
        const zz = (b.z - z0) / (z1 - z0), U = 1.2;
        const vz = U * Math.cos(Math.PI * (b.x - 0.5) * 2) * Math.sin(Math.PI * Math.max(0, Math.min(1, zz)));
        const vx = -U * 0.25 * Math.sin(Math.PI * (b.x - 0.5) * 2) * Math.cos(Math.PI * Math.max(0, Math.min(1, zz)));
        b.z += (vz + (Math.random() - .5) * .4) * dt; b.x += (vx + (Math.random() - .5) * .05) * dt;
      }
      b.x = Math.max(0.05, Math.min(0.95, b.x)); b.z = Math.max(0.1, Math.min(z1 - 0.1, b.z));
    });
  });
}
function drawConv() {
  const { c, W, H } = sc; c.clearRect(0, 0, W, H);
  tubes.forEach((tb, k) => {
    const cx = 120 + k * 200, w = 56, top = 40, bot = 380, ppz = 26;  // 1 cm = 26 px（試管寬放大）
    const wb = bot - NZ * DZ * ppz;
    for (let i = 0; i < NZ; i++) { c.fillStyle = wcol(tb.T[i]); c.fillRect(cx - w / 2, bot - (i + 1) * DZ * ppz, w, DZ * ppz + .5); }
    c.strokeStyle = '#495057'; c.lineWidth = 3;
    c.beginPath(); c.moveTo(cx - w / 2, top); c.lineTo(cx - w / 2, bot - w / 2); c.arc(cx, bot - w / 2, w / 2, Math.PI, 0, true); c.lineTo(cx + w / 2, top); c.stroke();
    // 色紙
    tb.bits.forEach(b => { c.fillStyle = '#e64980'; c.fillRect(cx - w / 2 + b.x * w - 3, bot - b.z * ppz - 2, 6, 4); });
    // 沸騰氣泡
    if (tb.boil && S.run) { c.strokeStyle = '#fff'; c.lineWidth = 2; for (let i = 0; i < 8; i++) { const zi = HEAT_AT[tb.k][0] * DZ + Math.random() * (NZ * DZ - HEAT_AT[tb.k][0] * DZ); c.beginPath(); c.arc(cx - w / 2 + 8 + Math.random() * (w - 16), bot - zi * ppz, 2 + Math.random() * 3, 0, 7); c.stroke(); } }
    // 火焰
    const fz = HEAT_AT[tb.k][1] * DZ * ppz;
    if (S.run) { if (tb.k === 'bottom') flame(c, cx, bot + 30, 30); else { c.save(); c.translate(cx - w / 2 - 6, bot - fz); c.rotate(Math.PI / 2); flame(c, 0, 0, 30); c.restore(); } }
    c.fillStyle = '#212529'; c.font = `bold 18px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'top';
    c.fillText(tb.k === 'bottom' ? '底部加熱' : '上方加熱', cx, 8);
    c.font = `bold 17px ${FONT}`; c.textBaseline = 'middle';
    c.fillText(`上 ${tb.T[NZ - 2].toFixed(0)}℃`, cx + w / 2 + 44, wb + 12);
    c.fillText(`下 ${tb.T[1].toFixed(0)}℃`, cx + w / 2 + 44, bot - 20);
  });
}

/* ================= 輻射：黑布與白布 ================= */
// 吸收率＝放射率（課本的簡化）；燈的熱輻射在 10 cm 處約 60 W/m²
const ABS = { black: 0.9, white: 0.3 }, AREA = 3e-4, CAP = 1.0, HA = 0.003, D = 0.10;
let rad;
function resetRad() { rad = { black: ROOM, white: ROOM, hist: [[0, ROOM, ROOM]] }; }
function irr() {
  if (S.src === 'lamp') return 60;
  const s = 5.67e-8, Ti = 273.15, Tr = 273.15 + ROOM, F = 0.06;   // 冰塊所占的視角比例
  return s * (Ti ** 4 - Tr ** 4) * F;                             // 負值：淨放出
}
function stepRad(dt) {
  const n = Math.ceil(dt / 0.1), h = dt / n;
  for (let i = 0; i < n; i++) {
    for (const k of ['black', 'white']) {
      // 吸收來自熱源的輻射；冷源時也是同一個係數決定放熱的快慢。另含與空氣的對流交換
      const Ta = S.src === 'ice' ? ROOM - 1.0 : ROOM;   // 冰塊附近的空氣略冷
      rad[k] += h * (ABS[k] * irr() * AREA - HA * (rad[k] - Ta)) / CAP;
    }
    S.t += h;
  }
  const lt = rad.hist[rad.hist.length - 1][0]; if (S.t - lt >= 1) rad.hist.push([S.t, rad.black, rad.white]);
}
function drawRad() {
  const { c, W, H } = sc; c.clearRect(0, 0, W, H);
  const cx = W / 2;
  if (S.src === 'lamp') {
    c.fillStyle = '#e9ecef'; c.strokeStyle = '#868e96'; c.lineWidth = 2; c.beginPath(); c.ellipse(cx, 360, 40, 26, 0, 0, 7); c.fill(); c.stroke();
    c.fillStyle = '#868e96'; c.fillRect(cx - 5, 322, 10, 14);
    if (S.run) flame(c, cx, 322, 60);
  } else {
    c.fillStyle = 'rgba(208,235,255,.9)'; c.strokeStyle = '#74c0fc'; c.lineWidth = 2;
    for (let i = 0; i < 9; i++) { const x = cx - 45 + (i % 3) * 30, y = 300 + Math.floor(i / 3) * 26; c.fillRect(x, y, 28, 24); c.strokeRect(x, y, 28, 24); }
  }
  // 溫度計
  [['black', cx - 150, '#212529', '黑布'], ['white', cx + 150, '#f1f3f5', '白布']].forEach(([k, x, col, name]) => {
    c.fillStyle = '#fff'; c.strokeStyle = '#868e96'; c.lineWidth = 1.5; c.fillRect(x - 5, 60, 10, 220); c.strokeRect(x - 5, 60, 10, 220);
    const ly = 280 - (rad[k] - 15) / 20 * 200;
    c.fillStyle = '#e03131'; c.fillRect(x - 2, Math.max(60, ly), 4, 280 - Math.max(60, ly));
    c.fillStyle = col; c.strokeStyle = '#495057'; c.beginPath(); c.ellipse(x, 300, 22, 26, 0, 0, 7); c.fill(); c.stroke();
    c.fillStyle = '#212529'; c.font = `bold 18px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'top';
    c.fillText(name, x, 334); c.font = `bold 24px ${FONT}`; c.fillText(`${rad[k].toFixed(1)}℃`, x, 24);
  });
  c.strokeStyle = '#adb5bd'; c.setLineDash([5, 5]); c.lineWidth = 1.5;
  c.beginPath(); c.moveTo(cx - 128, 300); c.lineTo(cx - 50, 300); c.moveTo(cx + 50, 300); c.lineTo(cx + 128, 300); c.stroke(); c.setLineDash([]);
  c.fillStyle = '#5f6b76'; c.font = `16px ${FONT}`; c.textAlign = 'center'; c.fillText('距離 10 cm', cx - 90, 278); c.fillText('距離 10 cm', cx + 90, 278);
}

/* ================= 圖表 ================= */
function drawGraph() {
  const { c, W, H } = gr; c.clearRect(0, 0, W, H);
  const P = { l: 52, r: 16, t: 30, b: 36 };
  let lines;
  if (S.mode === 'conv') lines = [[tubes[0].hist, 1, '#1c7ed6', '底部加熱・下'], [tubes[0].hist, 2, '#1c7ed6', '底部加熱・上', true], [tubes[1].hist, 1, '#e8590c', '上方加熱・下'], [tubes[1].hist, 2, '#e8590c', '上方加熱・上', true]];
  else lines = [[rad.hist, 1, '#212529', '黑布'], [rad.hist, 2, '#adb5bd', '白布']];
  const ys = lines.flatMap(l => l[0].map(p => p[l[1]]));
  const lo = S.mode === 'conv' ? 20 : Math.floor(Math.min(...ys) - 0.5), hi = S.mode === 'conv' ? 105 : Math.ceil(Math.max(...ys) + 0.5);
  const tmax = S.mode === 'conv' ? 120 : 180;
  const { X: Xp, Y } = axes(c, W, H, 0, tmax, lo, hi, '時間（秒）', '溫度（℃）', P);
  lines.forEach(([h, i, col, name, dash], j) => {
    c.strokeStyle = col; c.lineWidth = 3; c.setLineDash(dash ? [] : (S.mode === 'conv' ? [7, 5] : [])); c.beginPath();
    h.forEach((p, k) => { const x = Xp(p[0]), y = Y(p[i]); k ? c.lineTo(x, y) : c.moveTo(x, y); }); c.stroke(); c.setLineDash([]);
    c.fillStyle = col; c.font = `bold 15px ${FONT}`; c.textAlign = 'left'; c.textBaseline = 'top'; c.fillText((S.mode === 'conv' ? (dash ? '— ' : '- - ') : '— ') + name, P.l + 10 + (j % 2) * 150, P.t + 2 + Math.floor(j / 2) * 20);
  });
}

/* ================= 介面 ================= */
function tEnd() { return S.mode === 'cond' ? 1800 : S.mode === 'conv' ? 120 : 180; }
function reset() {
  S.run = false; S.t = 0; $('#go').textContent = S.mode === 'rad' && S.src === 'ice' ? '開始' : '開始加熱';
  resetCond(); resetConv(); resetRad(); condTable();
}
function setMode(v) {
  S.mode = v; $('#radCtl').hidden = v !== 'rad'; $('#condOut').hidden = v !== 'cond'; $('#graph').hidden = v === 'cond';
  $('#gnote').textContent = v === 'conv' ? '兩支試管水量相同（約 21 g），火焰相同。實線是水面附近，虛線是管底附近的溫度。試管寬度畫大了。' : v === 'rad' ? '兩支溫度計的底部分別用黑布、白布包住，與中央的距離相同。' : '';
  if (v !== 'cond') fit(gr);
  S.speed = v === 'cond' ? 20 : 5; setSeg('#speed', S.speed);
  reset();
}
seg('#mode', setMode);
seg('#speed', v => { S.speed = v; });
seg('#src', v => { S.src = v; reset(); });
$('#go').addEventListener('click', () => { if (S.t >= tEnd()) return; S.run = !S.run; $('#go').textContent = S.run ? '暫停' : '繼續'; });
$('#reset').addEventListener('click', reset);
function applyAdv() { $('#adv').checked = S.adv; document.querySelectorAll('.advonly').forEach(el => el.hidden = !S.adv); }
$('#adv').addEventListener('change', e => { S.adv = e.target.checked; store.set('adv', S.adv); applyAdv(); });
applyAdv(); setMode('cond');

let last = performance.now(), tick = 0;
function frame(now) {
  const real = Math.min(0.1, (now - last) / 1000); last = now;
  if (S.run) {
    const dt = Math.min(real * S.speed, tEnd() - S.t);
    if (S.mode === 'cond') stepCond(dt); else if (S.mode === 'conv') stepConv(dt); else stepRad(dt);
    if (S.t >= tEnd() - 1e-6) { S.run = false; $('#go').textContent = '已結束'; }
  }
  if (S.mode === 'conv') moveBits(real * S.speed);
  $('#rt').textContent = Math.floor(S.t);
  if (S.mode === 'cond') { drawCond(); if (++tick % 10 === 0) condTable(); }
  else if (S.mode === 'conv') { drawConv(); drawGraph(); }
  else { drawRad(); drawGraph(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
</body>
