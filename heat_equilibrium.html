<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>5-2 熱平衡</title>
<style>
:root{--ink:#1d2329;--muted:#5f6b76;--line:#d5dce2;--soft:#f3f6f8;--accent:#d9480f;--sel:#1864ab;--sel-soft:#e7f1fb;--water:#1c7ed6;--alc:#e8590c;--cold:#d0ebff;--hot:#ffe3d1;--ok:#2b8a3e}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--ink);font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:18px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px)) 40px max(16px,env(safe-area-inset-right,0px))}
header{padding:14px 0 8px;border-bottom:1px solid var(--line);margin-bottom:12px}
.top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
h1{font-size:26px;margin:0}
h2{font-size:21px;margin:22px 0 8px}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.nav a{font-size:16px;text-decoration:none;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:8px 12px;min-height:44px;display:inline-flex;align-items:center}
.nav a[aria-current]{background:var(--sel);color:#fff;border-color:var(--sel)}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:8px 0}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.grp>.lab{font-size:16px;color:var(--muted);margin-right:2px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);background:#fff;font:inherit;font-size:17px;min-height:44px;min-width:44px;padding:6px 12px;cursor:pointer;color:var(--ink)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--sel);color:#fff}
.btn{font:inherit;font-size:17px;min-height:44px;padding:6px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.45}
.switch{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:17px;cursor:pointer;user-select:none}
.switch input{width:22px;height:22px;accent-color:var(--sel)}
input[type=range]{width:180px;height:44px;accent-color:var(--sel)}
.stage{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.stage{grid-template-columns:minmax(0,1fr)}}
canvas{display:block;width:100%;height:auto;max-width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;touch-action:manipulation}
.reads{display:flex;flex-wrap:wrap;gap:8px 22px;margin:8px 0;font-size:18px}
.reads b{font-variant-numeric:tabular-nums;font-size:22px}
.note{font-size:16px;color:var(--muted);margin:6px 0}
.panel{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:10px 0;background:var(--soft)}
.ans{font-weight:700;color:var(--accent)}
.tbl{border-collapse:collapse;margin:12px 0;font-size:17px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 10px;text-align:center;white-space:nowrap}
@media (max-width:480px){.tbl th,.tbl td{padding:6px 6px}}
.tbl th{background:var(--soft);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="top">
    <h1>5-2 熱平衡</h1>
    <div class="grp">
      <label class="switch"><input type="checkbox" id="adv">進階</label>
    </div>
  </div>
  <nav class="nav" aria-label="第五章各站">
    <a href="heat_thermometer.html">1 溫度計</a>
    <a href="heat_rise.html">2 水溫上升</a>
    <a href="heat_equilibrium.html" aria-current="page">3 熱平衡</a>
    <a href="heat_specific.html">4 比熱</a>
    <a href="heat_matter.html">5 體積與三態</a>
    <a href="heat_transfer.html">6 熱的傳播</a>
  </nav>
</header>
<div class="bar">
  <div class="grp"><span class="lab">情境</span>
    <div class="seg" id="mode"><button data-v="cup" aria-pressed="true">熱水杯放進冷水</button><button data-v="coffee">熱咖啡與冰咖啡</button></div>
  </div>
</div>
<div class="bar" id="cupCtl">
  <div class="grp"><b style="color:#e03131">熱水</b><span class="lab">質量</span><input type="range" id="mH" min="50" max="300" step="50" value="100"><b id="mHv"></b><span class="lab">溫度</span><input type="range" id="tH" min="40" max="90" step="5" value="80"><b id="tHv"></b></div>
  <div class="grp"><b style="color:#1c7ed6">冷水</b><span class="lab">質量</span><input type="range" id="mC" min="50" max="300" step="50" value="100"><b id="mCv"></b><span class="lab">溫度</span><input type="range" id="tC" min="5" max="30" step="5" value="20"><b id="tCv"></b></div>
</div>
<div class="bar">
  <button class="btn primary" id="go">開始</button>
  <button class="btn" id="reset">重新開始</button>
  <div class="grp"><span class="lab">時間快轉</span>
    <div class="seg" id="speed"><button data-v="1">×1</button><button data-v="10" aria-pressed="true">×10</button><button data-v="60">×60</button></div>
  </div>
  <label class="switch advonly" hidden><input type="checkbox" id="xLoss">散熱到空氣</label>
</div>

<div class="stage">
  <div>
    <canvas id="scene" width="440" height="380" style="max-width:440px" aria-label="熱量流動示意"></canvas>
    <div class="reads" id="reads"></div>
  </div>
  <div>
    <canvas id="graph" width="640" height="340" aria-label="溫度與時間"></canvas>
    <p class="note" id="gnote">箭頭表示熱量流動的方向，箭頭愈粗表示流得愈快。咖啡情境：兩杯各 250 g，冰咖啡不含冰塊。</p>
    <div class="panel advonly" id="calc" hidden></div>
  </div>
</div>


</div>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const PFX = 'heateq-';
const store = {
  get(k, d) { try { const v = localStorage.getItem(PFX + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(PFX + k, JSON.stringify(v)); } catch (e) {} }
};
const FONT = 'system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif';
// 畫布：fixed=true 時固定邏輯尺寸、整張縮放；否則依實際寬度重設（文字維持原大小）
function setup(cv, fixed, hOf) {
  const o = { cv, c: cv.getContext('2d'), W: cv.width, H: cv.height, fixed, hOf };
  fit(o); return o;
}
function fit(o) {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  if (!o.fixed) { const w = Math.round(o.cv.getBoundingClientRect().width) || o.W; o.W = w; o.H = o.hOf(w); }
  o.cv.width = o.W * dpr; o.cv.height = o.H * dpr;
  if (!o.fixed) o.cv.style.height = o.H + 'px';
  o.c.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function seg(id, cb) {
  const el = $(id);
  el.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || !el.contains(b)) return;
    el.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
    const v = b.dataset.v; cb(isNaN(+v) ? v : +v);
  });
}
function setSeg(id, v) { $(id).querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.v) === String(v))); }
function axes(c, W, H, x0, x1, y0, y1, xl, yl, P) {
  c.strokeStyle = '#adb5bd'; c.lineWidth = 1; c.fillStyle = '#5f6b76'; c.font = `16px ${FONT}`;
  const X = x => P.l + (x - x0) / (x1 - x0) * (W - P.l - P.r), Y = y => H - P.b - (y - y0) / (y1 - y0) * (H - P.t - P.b);
  const nice = r => { const e = Math.pow(10, Math.floor(Math.log10(r / 5))), m = r / 5 / e; return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * e; };
  const dx = nice(x1 - x0), dy = nice(y1 - y0);
  c.textAlign = 'center'; c.textBaseline = 'top';
  for (let x = Math.ceil(x0 / dx) * dx; x <= x1 + 1e-9; x += dx) { c.globalAlpha = .4; c.beginPath(); c.moveTo(X(x), P.t); c.lineTo(X(x), H - P.b); c.stroke(); c.globalAlpha = 1; c.fillText(+x.toFixed(6) + '', X(x), H - P.b + 5); }
  c.textAlign = 'right'; c.textBaseline = 'middle';
  for (let y = Math.ceil(y0 / dy) * dy; y <= y1 + 1e-9; y += dy) { c.globalAlpha = .4; c.beginPath(); c.moveTo(P.l, Y(y)); c.lineTo(W - P.r, Y(y)); c.stroke(); c.globalAlpha = 1; c.fillText(+y.toFixed(6) + '', P.l - 6, Y(y)); }
  c.strokeStyle = '#495057'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(P.l, P.t); c.lineTo(P.l, H - P.b); c.lineTo(W - P.r, H - P.b); c.stroke();
  c.font = `16px ${FONT}`; c.fillStyle = '#343a40';
  c.textAlign = 'right'; c.textBaseline = 'bottom'; c.fillText(xl, W - P.r, H - P.b - 4);
  c.textAlign = 'left'; c.textBaseline = 'top'; c.fillText(yl, P.l + 6, 4);
  return { X, Y };
}

const ROOM = 25;
const K_CUP = 1.5;       // 金屬杯壁的傳熱：卡／(秒·℃)
const K_AIR = 0.08;      // 水面與杯壁散熱到空氣：卡／(秒·℃)
const K_COFFEE = 0.15;   // 一杯咖啡和空氣之間：卡／(秒·℃)
const COFFEE_M = 250;
const COL = { h: '#e03131', c: '#1c7ed6', air: '#868e96' };
const S = { mode: 'cup', run: false, t: 0, speed: 10, mH: 100, mC: 100, tH: 80, tC: 20, Th: 80, Tc: 20, hist: [], qOut: 0, qIn: 0, adv: store.get('adv', false) };

function reset() {
  S.run = false; S.t = 0; S.hist = []; S.qOut = 0; S.qIn = 0;
  if (S.mode === 'cup') { S.Th = S.tH; S.Tc = S.tC; } else { S.Th = 80; S.Tc = 5; }
  S.hist.push([0, S.Th, S.Tc]);
  $('#go').textContent = '開始';
}
function flows() {
  if (S.mode === 'cup') {
    const loss = S.adv && $('#xLoss').checked;
    return { hc: K_CUP * (S.Th - S.Tc), ha: 0, ca: loss ? K_AIR * (S.Tc - ROOM) : 0 };
  }
  return { hc: 0, ha: K_COFFEE * (S.Th - ROOM), ca: K_COFFEE * (S.Tc - ROOM) };
}
function step(dt) {
  const n = Math.ceil(dt / 0.25), h = dt / n;
  const mh = S.mode === 'cup' ? S.mH : COFFEE_M, mc = S.mode === 'cup' ? S.mC : COFFEE_M;
  for (let i = 0; i < n; i++) {
    const f = flows();
    const outH = (f.hc + f.ha) * h, inC = (f.hc - f.ca) * h;
    S.Th -= outH / mh; S.Tc += inC / mc;
    S.qOut += outH; S.qIn += f.hc * h;
    S.t += h;
  }
  const lastT = S.hist.length ? S.hist[S.hist.length - 1][0] : -1;
  if (S.t - lastT >= tEnd() / 400) S.hist.push([S.t, S.Th, S.Tc]);
  if (S.t >= tEnd()) { S.run = false; $('#go').textContent = '已結束'; }
}
function tEnd() { return S.mode === 'cup' ? (S.adv && $('#xLoss').checked ? 1200 : 300) : 7200; }

/* ---------- 畫面 ---------- */
const sc = setup($('#scene'), true);
const gH = w => w < 520 ? 280 : 340;
const gr = setup($('#graph'), false, gH);
window.addEventListener('resize', () => fit(gr));
function tint(T) { const k = Math.max(0, Math.min(1, (T - 5) / 80)); return `rgba(${Math.round(150 + 105 * k)},${Math.round(205 - 40 * k)},${Math.round(255 - 135 * k)},.8)`; }
function arrow(c, x0, y0, x1, y1, w, col) {
  if (w < 0.6) return;
  const a = Math.atan2(y1 - y0, x1 - x0), hl = 10 + w * 1.5;
  c.strokeStyle = col; c.fillStyle = col; c.lineWidth = w; c.lineCap = 'round';
  c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1 - hl * .8 * Math.cos(a), y1 - hl * .8 * Math.sin(a)); c.stroke();
  c.beginPath(); c.moveTo(x1, y1); c.lineTo(x1 - hl * Math.cos(a - .45), y1 - hl * Math.sin(a - .45)); c.lineTo(x1 - hl * Math.cos(a + .45), y1 - hl * Math.sin(a + .45)); c.closePath(); c.fill();
}
function label(c, s, x, y, col, size) { c.fillStyle = col; c.font = `bold ${size || 20}px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(s, x, y); }
const aw = q => Math.min(12, Math.abs(q) * 0.35);  // 箭頭粗細
function drawScene() {
  const { c, W, H } = sc; c.clearRect(0, 0, W, H);
  const f = flows();
  if (S.mode === 'cup') {
    // 外杯（冷水）
    const ox0 = 60, ox1 = 380, ot = 110, ob = 350;
    const cl = ob - (ob - ot - 20) * Math.min(1, (S.mC + S.mH * 0.6) / 600) - 20;
    c.fillStyle = tint(S.Tc); c.fillRect(ox0, cl, ox1 - ox0, ob - cl);
    c.strokeStyle = '#495057'; c.lineWidth = 3; c.beginPath(); c.moveTo(ox0, ot); c.lineTo(ox0, ob); c.lineTo(ox1, ob); c.lineTo(ox1, ot); c.stroke();
    // 內杯（金屬，熱水）
    const ix0 = 160, ix1 = 280, it = 70, ib = 320;
    const hl = ib - (ib - it - 10) * S.mH / 330;
    c.fillStyle = '#fff'; c.fillRect(ix0, it, ix1 - ix0, ib - it);
    c.fillStyle = tint(S.Th); c.fillRect(ix0, hl, ix1 - ix0, ib - hl);
    c.strokeStyle = '#868e96'; c.lineWidth = 5; c.beginPath(); c.moveTo(ix0, it); c.lineTo(ix0, ib); c.lineTo(ix1, ib); c.lineTo(ix1, it); c.stroke();
    label(c, `${S.Th.toFixed(1)}℃`, (ix0 + ix1) / 2, hl + 40, COL.h, 24);
    label(c, `熱水 ${S.mH} g`, (ix0 + ix1) / 2, 40, COL.h, 18);
    label(c, `${S.Tc.toFixed(1)}℃`, 105, ob - 40, COL.c, 24);
    label(c, `冷水 ${S.mC} g`, 330, 85, COL.c, 18);
    const w = aw(f.hc);
    const dir = f.hc >= 0 ? 1 : -1;
    for (const y of [220, 270]) { arrow(c, dir > 0 ? ix0 + 10 : ix0 - 50, y, dir > 0 ? ix0 - 50 : ix0 + 10, y, w, '#f08c00'); arrow(c, dir > 0 ? ix1 - 10 : ix1 + 50, y, dir > 0 ? ix1 + 50 : ix1 - 10, y, w, '#f08c00'); }
    if (f.ca > 0) arrow(c, 100, cl - 5, 100, cl - 45, aw(f.ca * 6), '#f08c00');
  } else {
    c.fillStyle = '#f8f9fa'; c.fillRect(0, 0, W, H);
    label(c, `空氣（室溫 ${ROOM}℃）`, W / 2, 30, '#495057', 18);
    const cup = (x, T, name, col, ice) => {
      c.fillStyle = tint(T); c.beginPath(); c.moveTo(x - 60, 170); c.lineTo(x - 48, 330); c.lineTo(x + 48, 330); c.lineTo(x + 60, 170); c.closePath(); c.fill();
      c.strokeStyle = '#495057'; c.lineWidth = 3; c.beginPath(); c.moveTo(x - 66, 140); c.lineTo(x - 48, 330); c.lineTo(x + 48, 330); c.lineTo(x + 66, 140); c.stroke();
      label(c, `${T.toFixed(1)}℃`, x, 260, col, 24);
      label(c, name, x, 360, col, 18);
    };
    cup(120, S.Th, '熱咖啡', COL.h, false);
    cup(320, S.Tc, '冰咖啡', COL.c, true);
    const w1 = aw(f.ha * 3), w2 = aw(f.ca * 3);
    if (f.ha > 0) { arrow(c, 120, 135, 120, 70, w1, '#f08c00'); arrow(c, 185, 200, 215, 170, w1, '#f08c00'); }
    if (f.ca < 0) { arrow(c, 320, 70, 320, 135, w2, '#f08c00'); arrow(c, 235, 170, 255, 200, w2, '#f08c00'); }
  }
}
function drawGraph() {
  const { c, W, H } = gr; c.clearRect(0, 0, W, H);
  const P = { l: 52, r: 16, t: 30, b: 36 };
  const coffee = S.mode === 'coffee', unit = coffee ? 60 : 1;
  const tmax = coffee ? 120 : tEnd();
  const ys = S.hist.flatMap(p => [p[1], p[2]]);
  const lo = Math.max(0, Math.floor((Math.min(...ys, ROOM) - 5) / 5) * 5), hi = Math.ceil((Math.max(...ys, ROOM) + 5) / 5) * 5;
  const { X: Xp, Y } = axes(c, W, H, 0, tmax, lo, hi, coffee ? '時間（分）' : '時間（秒）', '溫度（℃）', P);
  if (coffee || (S.adv && $('#xLoss').checked)) { c.strokeStyle = COL.air; c.setLineDash([6, 5]); c.lineWidth = 1.5; c.beginPath(); c.moveTo(P.l, Y(ROOM)); c.lineTo(W - P.r, Y(ROOM)); c.stroke(); c.setLineDash([]); c.fillStyle = COL.air; c.font = `16px ${FONT}`; c.textAlign = 'right'; c.textBaseline = 'bottom'; c.fillText('室溫', W - P.r - 4, Y(ROOM) - 2); }
  for (const [i, col] of [[1, COL.h], [2, COL.c]]) {
    c.strokeStyle = col; c.lineWidth = 3; c.beginPath();
    S.hist.forEach((p, j) => { const x = Xp(p[0] / unit), y = Y(p[i]); j ? c.lineTo(x, y) : c.moveTo(x, y); });
    c.stroke();
  }
  c.font = `bold 16px ${FONT}`; c.textAlign = 'left'; c.textBaseline = 'top';
  c.fillStyle = COL.h; c.fillText(coffee ? '熱咖啡' : '熱水', P.l + 12, P.t + 4);
  c.fillStyle = COL.c; c.fillText(coffee ? '冰咖啡' : '冷水', P.l + 12, P.t + 26);
}
function reads() {
  if (S.mode === 'cup') {
    $('#reads').innerHTML = `<span>時間 <b>${Math.floor(S.t)}</b> 秒</span><span>熱水放出 <b>${Math.round(S.qOut)}</b> 卡</span><span>冷水吸收 <b>${Math.round(S.qIn)}</b> 卡</span>`;
  } else {
    $('#reads').innerHTML = `<span>時間 <b>${Math.floor(S.t / 60)}</b> 分</span>`;
  }
}
function calc() {
  const el = $('#calc'); if (!S.adv || S.mode !== 'cup') { el.hidden = true; return; }
  el.hidden = false;
  const Tf = (S.mH * S.tH + S.mC * S.tC) / (S.mH + S.mC);
  el.innerHTML = `沒有散熱時：熱水放熱 ＝ 冷水吸熱<br>${S.mH} ×（${S.tH} − T）＝ ${S.mC} ×（T − ${S.tC}）<br><button class="btn" id="showTf">算出平衡溫度</button> <span class="ans" id="tf" hidden>T ＝ ${Tf.toFixed(1)}℃</span>`;
  $('#showTf').onclick = () => { $('#tf').hidden = false; };
}

/* ---------- 介面 ---------- */
const sliders = [['#mH', 'mH', ' g'], ['#tH', 'tH', '℃'], ['#mC', 'mC', ' g'], ['#tC', 'tC', '℃']];
sliders.forEach(([id, k, u]) => {
  const el = $(id), out = $(id + 'v');
  const upd = () => { S[k] = +el.value; out.textContent = el.value + u; };
  upd(); el.addEventListener('input', () => { upd(); reset(); calc(); });
});
seg('#mode', v => { S.mode = v; $('#cupCtl').hidden = v !== 'cup'; S.speed = v === 'cup' ? 10 : 60; setSeg('#speed', S.speed); reset(); calc(); });
seg('#speed', v => { S.speed = v; });
$('#go').addEventListener('click', () => { if (S.t >= tEnd()) return; S.run = !S.run; $('#go').textContent = S.run ? '暫停' : '繼續'; });
$('#reset').addEventListener('click', reset);
$('#xLoss').addEventListener('change', reset);
function applyAdv() { $('#adv').checked = S.adv; document.querySelectorAll('.advonly').forEach(el => el.hidden = !S.adv); calc(); }
$('#adv').addEventListener('change', e => { S.adv = e.target.checked; store.set('adv', S.adv); applyAdv(); reset(); });
applyAdv(); reset();

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000) * S.speed; last = now;
  if (S.run) step(dt);
  drawScene(); drawGraph(); reads();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
